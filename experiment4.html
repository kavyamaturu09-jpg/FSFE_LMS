<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Dashboard</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition-speed: 0.3s ease;
        }
        
        [data-theme="dark"] {
            --primary-color: #6366f1;
            --primary-hover: #818cf8;
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: color var(--transition-speed);
        }

        nav a:hover {
            color: var(--primary-color);
        }

        .theme-toggle {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color var(--transition-speed);
        }

        .theme-toggle:hover {
            background-color: var(--primary-hover);
        }

        .dashboard-container {
            container-type: inline-size;
            container-name: dashboard;
            width: 100%;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card h3 {
            margin-bottom: 0.75rem;
            color: var(--primary-color);
        }

        .card p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .card-btn {
            align-self: flex-start;
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .card-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .card:has(.urgent-badge) {
            border-color: #ef4444;
            border-width: 2px;
        }

        .urgent-badge {
            background-color: #fee2e2;
            color: #991b1b;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 0.75rem;
        }

        @container dashboard (min-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @container dashboard (min-width: 1200px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .card {
                opacity: 1;
                transform: none;
            }
            .card:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">UniCampus Hub</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <a href="#clubs">Clubs</a>
            <a href="#services">Services</a>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">Dark Mode</button>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="cards-grid">
            <div class="card">
                <div>
                    <h3>Campus Events</h3>
                    <p>Check out the upcoming annual tech fest, cultural nights, and guest lecture schedules.</p>
                </div>
                <a href="#events" class="card-btn">View Events</a>
            </div>

            <div class="card">
                <div>
                    <h3>Student Clubs</h3>
                    <p>Join coding clubs, photography societies, robotics teams, and cultural communities.</p>
                </div>
                <a href="#clubs" class="card-btn">Explore Clubs</a>
            </div>

            <div class="card">
                <div>
                    <span class="urgent-badge">Important
